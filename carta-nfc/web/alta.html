<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Alta de restaurantes</title>
  <link rel="stylesheet" href="/assets/app.css">
  <style>
    .w { max-width: 760px; margin: 0 auto; padding: 24px 16px 60px; }
    .pad { padding: 18px; margin-bottom: 16px; }
    .fila { display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-end; }
    .fila .field { flex: 1 1 160px; margin: 6px 0; }
    .r { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-top: 1px solid var(--line); flex-wrap: wrap; }
    .r:first-child { border-top: 0; }
    .r .n { flex: 1 1 200px; }
    .secreto { margin-top: 14px; padding: 14px; border-radius: 12px; background: var(--surface-2); word-break: break-all; }
    .secreto div { margin: 8px 0; }
  </style>
</head>
<body>
  <div class="w">
    <h1 style="margin-bottom:6px">Alta de restaurantes</h1>
    <p class="muted">Panel del vendedor: da de alta cada local y entrégale sus enlaces.</p>

    <form id="f-login" class="card pad">
      <label class="field"><span>Clave de plataforma</span><input type="password" id="clave" autocomplete="current-password" required></label>
      <button class="btn primary" type="submit">Entrar</button>
    </form>

    <div id="zona" hidden>
      <form id="f-alta" class="card pad">
        <h2>Nuevo restaurante</h2>
        <div class="fila">
          <label class="field"><span>Nombre</span><input type="text" id="nombre" maxlength="80" required placeholder="Bar Casa Pepe"></label>
          <label class="field"><span>Identificador (URL)</span><input type="text" id="slug" required pattern="[a-z0-9][a-z0-9\-]{1,38}[a-z0-9]" placeholder="casa-pepe"></label>
          <label class="field" style="flex:0 1 110px"><span>Nº mesas</span><input type="number" id="mesas" value="10" min="0" max="200"></label>
        </div>
        <button class="btn primary" type="submit">Dar de alta</button>
        <div id="resultado"></div>
      </form>
      <div class="card pad">
        <h2>Restaurantes</h2>
        <div id="lista"></div>
      </div>
    </div>
  </div>

  <script src="/assets/config.js"></script>
  <script src="/assets/api.js"></script>
  <script>
  (function () {
    const { rpc, esc, toast } = window.Carta;
    const $ = (id) => document.getElementById(id);
    let clave = null;
    try { clave = sessionStorage.getItem('carta:plataforma'); } catch { /* */ }

    async function llamar(accion, datos) {
      try {
        const r = await rpc('carta_plataforma', { p_clave: clave, p_accion: accion, p_datos: datos || {} });
        try { sessionStorage.setItem('carta:plataforma', clave); } catch { /* */ }
        $('f-login').hidden = true;
        $('zona').hidden = false;
        pintar(r.restaurantes);
        return r;
      } catch (e) {
        if (e.code === 'clave_incorrecta') { $('f-login').hidden = false; $('zona').hidden = true; }
        toast(e.humano, 'error');
        return null;
      }
    }

    function pintar(lista) {
      $('lista').innerHTML = lista.length ? lista.map((r) => `
        <div class="r">
          <div class="n"><strong>${esc(r.nombre)}</strong> ${r.activo ? '' : '<span class="chip">Desactivado</span>'}<br>
            <span class="small muted">${esc(r.slug)} · ${r.mesas} mesas · ${r.pedidos_7d} pedidos en 7 días</span></div>
          <a class="btn sm" href="/r/${encodeURIComponent(r.slug)}" target="_blank" rel="noopener">Carta ↗</a>
          <button class="btn sm" data-reset="${esc(r.slug)}">Nueva clave admin</button>
          <button class="btn sm ${r.activo ? 'danger' : ''}" data-activo="${esc(r.slug)}" data-valor="${!r.activo}">${r.activo ? 'Desactivar' : 'Activar'}</button>
        </div>`).join('') : '<p class="muted">Aún no hay restaurantes.</p>';
    }

    function enlaces(res) {
      const o = location.origin, s = encodeURIComponent(res.slug);
      const filas = [
        ['Carta pública (NFC general)', `${o}/r/${s}`],
        res.clave_admin ? ['Gestión (admin) — para el dueño', `${o}/admin.html?r=${s}&k=${encodeURIComponent(res.clave_admin)}`] : null,
        res.clave_cocina ? ['Panel de comandas — tablet de cocina/barra', `${o}/cocina.html?r=${s}&k=${encodeURIComponent(res.clave_cocina)}`] : null,
        res.clave_cocina ? ['Móvil junto al TPV — pack "Solo pedidos" (misma clave de cocina)', `${o}/movil.html?r=${s}&k=${encodeURIComponent(res.clave_cocina)}`] : null,
      ].filter(Boolean);
      $('resultado').innerHTML = `<div class="secreto"><strong>✓ ${esc(res.slug)}</strong> — guarda estos enlaces ahora, las claves no se vuelven a mostrar:
        ${filas.map(([t, u]) => `<div><span class="small muted">${esc(t)}</span><br><code>${esc(u)}</code></div>`).join('')}
        <p class="small muted">Siguiente paso: abre el enlace de gestión en un Android con Chrome → "Mesas y NFC" → "Grabar NFC" en cada mesa.</p></div>`;
    }

    $('nombre').addEventListener('input', () => {
      if ($('slug').dataset.tocado) return;
      $('slug').value = $('nombre').value.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '')
        .replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 40);
    });
    $('slug').addEventListener('input', () => { $('slug').dataset.tocado = '1'; });

    $('f-login').addEventListener('submit', (ev) => { ev.preventDefault(); clave = $('clave').value; llamar('listar'); });
    $('f-alta').addEventListener('submit', async (ev) => {
      ev.preventDefault();
      const r = await llamar('alta', { nombre: $('nombre').value.trim(), slug: $('slug').value.trim(), mesas: parseInt($('mesas').value, 10) || 0 });
      if (r) { enlaces(r); $('nombre').value = ''; $('slug').value = ''; delete $('slug').dataset.tocado; }
    });
    document.addEventListener('click', async (ev) => {
      const b = ev.target.closest('button');
      if (!b) return;
      if (b.dataset.activo) {
        const activar = b.dataset.valor === 'true';
        if (activar || confirm('¿Desactivar? Su carta y sus NFC dejarán de funcionar.')) llamar('activo', { slug: b.dataset.activo, activo: activar });
      } else if (b.dataset.reset) {
        if (!confirm('¿Generar nueva clave de admin para ' + b.dataset.reset + '? La anterior deja de funcionar.')) return;
        const r = await llamar('clave_admin', { slug: b.dataset.reset });
        if (r) enlaces(r);
      }
    });

    if (clave) llamar('listar');
  })();
  </script>
</body>
</html>
