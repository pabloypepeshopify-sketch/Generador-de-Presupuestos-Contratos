<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Demo en directo · Pedidos desde la mesa</title>
  <link rel="stylesheet" href="/assets/app.css">
  <style>
    /* Demo para enseñar en el bar: el cliente pide a la izquierda y llega al móvil del bar a la derecha.
       Uso: /demo.html?r=<slug>&k=<clave del panel>&m=<código de mesa>  (la clave no se queda en la barra). */
    body { background: #111412; color: #f3f0ea; overflow-x: hidden; }
    .top { max-width: 1100px; margin: 0 auto; padding: 18px 16px 8px; text-align: center; }
    .top h1 { font-size: clamp(22px, 4vw, 32px); }
    .top p { margin: 6px 0 0; color: #b9b2a6; }
    .tabs-demo { display: none; justify-content: center; gap: 8px; margin: 12px 0 0; }
    .tabs-demo button { border: 1px solid #3a3a36; background: #1d201e; color: #f3f0ea; border-radius: 999px; padding: 10px 18px; font-weight: 700; cursor: pointer; }
    .tabs-demo button[aria-selected="true"] { background: #fca80c; border-color: #fca80c; color: #131313; }
    .moviles { display: flex; justify-content: center; align-items: flex-start; gap: 28px; padding: 16px; }
    .movil { text-align: center; }
    .movil h2 { font-size: 15px; letter-spacing: .12em; text-transform: uppercase; color: #fca80c; margin-bottom: 10px; }
    .marco { width: 390px; height: min(780px, calc(100vh - 170px)); min-height: 560px; border: 10px solid #000; border-radius: 42px;
      overflow: hidden; background: #fff; box-shadow: 0 20px 60px rgba(0,0,0,.5), 0 0 0 2px #333; }
    .marco iframe { width: 100%; height: 100%; border: 0; display: block; }
    .flecha { align-self: center; font-size: 44px; color: #fca80c; }
    .error { max-width: 560px; margin: 40px auto; padding: 18px; background: #1d201e; border-radius: 14px; }
    @media (max-width: 900px) {
      .tabs-demo { display: flex; }
      .flecha, .movil h2 { display: none; }
      .moviles { padding: 10px 8px; }
      .movil { width: 100%; }
      .movil:not(.activo) { position: absolute; left: -10000px; }  /* sigue cargado: el panel sigue sonando */
      .marco { width: 100%; max-width: 430px; margin: 0 auto; height: calc(100vh - 150px); border-width: 6px; border-radius: 28px; }
    }
  </style>
</head>
<body>
  <header class="top">
    <h1>Pide en el móvil del cliente y mira cómo llega al bar</h1>
    <p>Toca "activar el sonido" en el móvil del bar y haz un pedido.</p>
    <div class="tabs-demo" role="tablist">
      <button type="button" role="tab" data-ver="cliente" aria-selected="true">📱 Cliente</button>
      <button type="button" role="tab" data-ver="bar" aria-selected="false">🛎️ Bar</button>
    </div>
  </header>
  <main class="moviles" id="moviles" hidden>
    <section class="movil activo" data-movil="cliente"><h2>Cliente en la mesa</h2><div class="marco"><iframe id="f-cliente" title="Carta del cliente"></iframe></div></section>
    <div class="flecha" aria-hidden="true">→</div>
    <section class="movil" data-movil="bar"><h2>Móvil junto al TPV</h2><div class="marco"><iframe id="f-bar" title="Panel del bar" allow="autoplay; screen-wake-lock"></iframe></div></section>
  </main>
  <div class="error" id="error" hidden>
    <h2>Falta el enlace de la demo</h2>
    <p>Ábrela así: <code>/demo.html?r=&lt;restaurante&gt;&amp;k=&lt;clave del panel&gt;&amp;m=&lt;código de una mesa&gt;</code></p>
  </div>
  <script>
  (function () {
    const qs = new URLSearchParams(location.search);
    const r = (qs.get('r') || '').toLowerCase(), k = qs.get('k') || '', m = qs.get('m') || '';
    if (!/^[a-z0-9-]{3,40}$/.test(r) || !k) { document.getElementById('error').hidden = false; return; }
    history.replaceState(null, '', location.pathname);  // la clave no se queda a la vista
    document.getElementById('f-cliente').src = /^[0-9a-f]{6,20}$/i.test(m) ? '/m/' + m : '/r/' + encodeURIComponent(r);
    document.getElementById('f-bar').src = '/cocina.html?r=' + encodeURIComponent(r) + '&k=' + encodeURIComponent(k);
    document.getElementById('moviles').hidden = false;
    document.addEventListener('click', (ev) => {
      const b = ev.target.closest('[data-ver]');
      if (!b) return;
      document.querySelectorAll('[data-ver]').forEach((x) => x.setAttribute('aria-selected', String(x === b)));
      document.querySelectorAll('[data-movil]').forEach((x) => x.classList.toggle('activo', x.dataset.movil === b.dataset.ver));
    });
  })();
  </script>
</body>
</html>
